<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Shopping List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1a73e8;
            text-align: center;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #1557b0;
        }
        #output {
            padding: 15px;
            background-color: #f8f9fa;
            border-left: 4px solid #1a73e8;
            border-radius: 4px;
            white-space: pre-wrap;
            min-height: 50px;
        }
    </style>
</head>
<body>

    <h1>Visual Shopping List</h1>
    
    <div class="input-group">
        <input type="text" id="userInput" placeholder="e.g., Suggest items for a healthy grocery list...">
        <button onclick="handleUserClick()">Ask Gemini</button>
    </div>

    <h3>Response / Results:</h3>
    <div id="output">Your Gemini results will appear here...</div>

    <script>
        // Gemini API Configuration
        const GEMINI_API_KEY = "AQ.Ab8RN6KxqAyx76ayxRcK2yZgRjN6WRYfIMUpWXxuY--m2DpxGA";

        async function callGeminiAPI(promptText) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: promptText }]
                        }]
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    console.error("Gemini API Error Response:", data);
                    return `Error: ${data.error?.message || response.statusText}`;
                }

                return data.candidates?.[0]?.content?.parts?.[0]?.text || "No response generated.";
            } catch (error) {
                console.error("Network or Parsing Error:", error);
                return null;
            }
        }

        async function handleUserClick() {
            const inputVal = document.getElementById('userInput').value;
            if (!inputVal.trim()) {
                alert("Please type something first!");
                return;
            }

            document.getElementById('output').innerText = "Thinking...";
            
            const result = await callGeminiAPI(inputVal);
            document.getElementById('output').innerText = result;
        }
    </script>
</body>
</html>
