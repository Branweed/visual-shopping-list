<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Shopping List with Gemini AI</title>
    <style>
        :root {
            --primary-color: #1a73e8;
            --primary-hover: #1557b0;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dadce0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            max-width: 650px;
            margin: 30px auto;
            padding: 20px;
        }
        .container {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 25px;
        }
        .section {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        h3 {
            margin-top: 0;
            color: #202124;
            font-size: 1.1rem;
        }
        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: var(--primary-color);
        }
        button {
            padding: 12px 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        ul.shopping-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        ul.shopping-list li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            background: #fdfdfd;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 8px;
        }
        ul.shopping-list li.completed span {
            text-decoration: line-through;
            color: #80868b;
        }
        .item-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            cursor: pointer;
        }
        .delete-btn {
            background: transparent;
            color: #d93025;
            border: none;
            padding: 6px 10px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
        }
        .delete-btn:hover {
            background: #fce8e6;
        }
        #ai-response {
            background: #f1f3f4;
            padding: 15px;
            border-radius: 6px;
            font-size: 14px;
            white-space: pre-wrap;
            margin-top: 10px;
            border-left: 4px solid var(--primary-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Visual Shopping List</h1>

        <!-- Add Manual Item Section -->
        <div class="section">
            <h3>Add Shopping Item</h3>
            <div class="input-row">
                <input type="text" id="itemInput" placeholder="e.g., Bananas, Milk, Bread..." onkeypress="checkEnter(event)">
                <button onclick="addItem()">Add Item</button>
            </div>
        </div>

        <!-- AI Assistant Section -->
        <div class="section">
            <h3>Ask Gemini AI for Suggestions</h3>
            <div class="input-row">
                <input type="text" id="aiPromptInput" placeholder="e.g., Ingredients for taco night..." onkeypress="checkAIPromptEnter(event)">
                <button onclick="askGemini()">Ask AI</button>
            </div>
            <div id="ai-response" style="display: none;"></div>
        </div>

        <!-- Current Shopping List Section -->
        <div class="section">
            <h3>My List (<span id="itemCount">0</span> items)</h3>
            <ul id="shoppingList" class="shopping-list">
                <!-- Items render here -->
            </ul>
        </div>
    </div>

    <script>
        // Gemini API Configuration
        const GEMINI_API_KEY = "AQ.Ab8RN6KxqAyx76ayxRcK2yZgRjN6WRYfIMUpWXxuY--m2DpxGA";

        // Local Storage State
        let items = JSON.parse(localStorage.getItem('shopping_items')) || [];

        window.onload = function() {
            renderList();
        };

        function saveAndRender() {
            localStorage.setItem('shopping_items', JSON.stringify(items));
            renderList();
        }

        function addItem() {
            const input = document.getElementById('itemInput');
            const text = input.value.trim();
            if (!text) return;

            items.push({ text: text, completed: false });
            input.value = '';
            saveAndRender();
        }

        function checkEnter(event) {
            if (event.key === 'Enter') addItem();
        }

        function checkAIPromptEnter(event) {
            if (event.key === 'Enter') askGemini();
        }

        function toggleItem(index) {
            items[index].completed = !items[index].completed;
            saveAndRender();
        }

        function deleteItem(index) {
            items.splice(index, 1);
            saveAndRender();
        }

        function renderList() {
            const listEl = document.getElementById('shoppingList');
            const countEl = document.getElementById('itemCount');
            
            listEl.innerHTML = '';
            countEl.innerText = items.length;

            if (items.length === 0) {
                listEl.innerHTML = '<li style="justify-content: center; color: #80868b; font-style: italic;">Your shopping list is empty. Add items above or ask Gemini AI!</li>';
                return;
            }

            items.forEach((item, index) => {
                const li = document.createElement('li');
                if (item.completed) {
                    li.classList.add('completed');
                }

                li.innerHTML = `
                    <div class="item-left" onclick="toggleItem(${index})">
                        <input type="checkbox" ${item.completed ? 'checked' : ''} onclick="event.stopPropagation(); toggleItem(${index})">
                        <span>${escapeHtml(item.text)}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteItem(${index})">Delete</button>
                `;
                listEl.appendChild(li);
            });
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        async function askGemini() {
            const promptInput = document.getElementById('aiPromptInput');
            const responseDiv = document.getElementById('ai-response');
            const promptText = promptInput.value.trim();

            if (!promptText) {
                alert("Please enter a prompt for Gemini!");
                return;
            }

            responseDiv.style.display = 'block';
            responseDiv.innerText = 'Thinking...';

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: "Provide a helpful, concise shopping list or suggestions for: " + promptText }]
                        }]
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    console.error("Gemini API Error Response:", data);
                    responseDiv.innerText = `Error: ${data.error?.message || response.statusText}`;
                    return;
                }

                const resultText = data.candidates?.[0]?.content?.parts?.[0]?.text || "No response generated.";
                responseDiv.innerText = resultText;
            } catch (error) {
                console.error("Network Error:", error);
                responseDiv.innerText = "Network error connecting to Gemini API.";
            }
        }
    </script>
</body>
</html>
